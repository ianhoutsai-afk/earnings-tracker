name: Reviewed Metric Evidence
on:
  push:
    branches: [codex/reviewed-quarter-metrics-20261030]
    paths: ['probe_metric_adapters.py', '.github/workflows/metric-evidence.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lxml requests pandas yfinance
      - run: python probe_metric_adapters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-metric-originals
          path: metric-evidence/
