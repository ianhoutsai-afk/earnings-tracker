name: Build S&P 500 Cache

on:
  schedule:
    # 每季執行一次 (1月1日、4月1日、7月1日、10月1日 的 UTC 06:00)
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-data-write
  cancel-in-progress: false

jobs:
  build-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh official mapping without replacing the tracked universe
        env:
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python publication.py --mode mapping --result "$RUNNER_TEMP/publication_result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarterly-publication-result
          path: ${{ runner.temp }}/publication_result.json
          if-no-files-found: warn
