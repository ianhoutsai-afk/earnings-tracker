name: Build S&P 500 Cache

on:
  schedule:
    # 每季執行一次 (1月1日、4月1日、7月1日、10月1日 的 UTC 06:00)
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  build-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml

      - name: Execute build_cache.py
        env:
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python build_cache.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sp500_mapping.json
          git commit -m "Auto-build S&P 500 cache [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
