name: Inspect missing fields for capped 150-item backfill
on:
  push:
    branches: [codex/fill-150-official-metrics-20261105]
    paths: ['inspect_missing_150.py','.github/workflows/inspect-150.yml']
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install lxml requests pandas yfinance
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python inspect_missing_150.py
      - run: |
          git add audit-150
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture read-only revenue gap evidence'
          git push origin HEAD
