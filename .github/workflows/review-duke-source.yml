name: Prepare exact Duke source chunks for read-only review
on:
  push:
    branches: [codex/duke-source-review-20261106]
    paths: ['.github/workflows/review-duke-source.yml']
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split immutable source snapshot
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json
          from pathlib import Path
          url='https://raw.githubusercontent.com/ianhoutsai-afk/earnings-tracker/c0dfc0dd6c8987a23ab5d0d7e5962a9458edc4ec/audit-50/sources/DUK-2026-09-30.html'
          body=urllib.request.urlopen(url).read()
          assert hashlib.sha256(body).hexdigest()=='44fe4f54c61fc3ec3b5697f3d6f826d6f4fd825aed59737d762b15b89d8b673a'
          text=body.decode('utf-8')
          root=Path('review-source');root.mkdir(exist_ok=True)
          files=[]
          for index,start in enumerate(range(0,len(text),2000000),1):
              p=root/('DUK.part'+str(index)+'.txt')
              p.write_text(text[start:start+2000000],encoding='utf-8');files.append(str(p))
          (root/'manifest.json').write_text(json.dumps({'sourceUrl':'https://www.sec.gov/Archives/edgar/data/1326160/000132616026000051/duk-20260930.htm','sourceSha256':hashlib.sha256(body).hexdigest(),'bytes':len(body),'parts':files},indent=2)+'\n')
          print('Verified source hash and wrote '+str(len(files))+' chunks')
          PY
      - run: |
          git add review-source
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retain verified Duke source chunks for independent read-only review'
          git push origin HEAD
