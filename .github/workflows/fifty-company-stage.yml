name: Validate fifty-company quarterly backfill
on:
  push:
    branches: [codex/verified-50-companies-20261107]
    paths: ['stage_fifty.py','.github/workflows/fifty-company-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install lxml requests pandas yfinance
      - run: python stage_fifty.py
      - run: python -m unittest discover -q
      - run: node --test test_*.mjs
      - run: python validate_quarterly_data.py
      - run: |
          git rm collect_facts.py collect_release.py collect_wide.py fact-candidates.json release-candidates.json wide-candidates.json selected-fifty.json stage_fifty.py .github/workflows/fifty-company-facts.yml .github/workflows/fifty-release-eps.yml .github/workflows/fifty-company-wide.yml .github/workflows/fifty-company-stage.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json data.json docs/fifty-company-backfill-2026-11-07.json docs/evidence-fifty-companies-2026-11-07
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fill verified quarterly metrics for fifty companies'
          git push origin HEAD
