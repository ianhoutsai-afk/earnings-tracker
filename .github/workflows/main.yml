name: Earnings Tracker Update

on:
  push:
    branches: [main]
    paths: ['*.py', '.github/workflows/main.yml']
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: earnings-data-write
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - name: Install dependencies
        run: python -m pip install yfinance requests pandas lxml
      - name: Select current publication source
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$build_type" in legacy|workflow) ;; *) exit 1 ;; esac
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          if [[ "$build_type" == workflow ]]; then
            bash scripts/release-data.sh restore
          fi
      - name: Check quarterly regressions
        run: python -m unittest discover -q
      - name: Discover dates across all companies without importing third-party actuals
        id: discovery
        continue-on-error: true
        run: |
          if [[ "${{ github.event.schedule }}" == "0 1 * * *" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python verified_history.py --scan
          else
            python verified_history.py
          fi
      - name: Check official quarterly releases for every active issuer
        id: official
        continue-on-error: true
        env:
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python official_sync.py --full
      - name: Validate the complete publication bundle
        id: validate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python validate_quarterly_data.py
      - name: Publish the verified snapshot
        if: ${{ !cancelled() && steps.publication.outcome == 'success' && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BUILD_TYPE: ${{ steps.publication.outputs.build_type }}
        run: bash scripts/publish-data.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
      - name: Report source failure visibly
        if: steps.official.outcome == 'failure' || steps.discovery.outcome == 'failure'
        run: exit 1
