name: Earnings Tracker Update

on:
  schedule:
    # UTC 01:00（台灣/北京 09:00）會更新資料並發送今日財報通知。
    - cron: '0 1 * * *'
    # UTC 13:00（台灣/北京 21:00）只更新資料，避免重複通知。
    - cron: '0 13 * * *'
    # 每月 1 日執行完整重建
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas lxml

      - name: 執行資料更新程式碼（增量模式，只抓即將發布的公司）
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python update_data.py

      - name: 每月完整重建一次（月初 cron 觸發時）
        if: github.event.schedule == '0 2 1 * *'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python update_data.py --full

      - name: 發送今日財報 Bark 通知
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *') }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          EARNINGS_TIMEZONE: Asia/Shanghai
        run: python notify_bark.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json historical_data.json sp500_mapping.json
          git commit -m "Auto-update S&P 500 earnings data [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
