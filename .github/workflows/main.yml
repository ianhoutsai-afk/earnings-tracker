name: Earnings Tracker Update

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-data-write
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - name: Install dependencies
        run: python -m pip install yfinance requests pandas lxml
      - name: Stage, validate and publish from current main
        env:
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mode=full
          if [[ "${{ github.event.schedule }}" == "0 1 * * *" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then mode=daily; fi
          python publication.py --mode "$mode" --result "$RUNNER_TEMP/publication_result.json"
      - name: Preserve authorization even when source checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-publication-result
          path: ${{ runner.temp }}/publication_result.json
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
