name: Earnings Tracker Update

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-data-write
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - name: Install dependencies
        run: python -m pip install yfinance requests pandas lxml
      - name: Discover dates across all companies without importing third-party actuals
        id: discovery
        continue-on-error: true
        run: |
          if [[ "${{ github.event.schedule }}" == "0 1 * * *" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python verified_history.py --scan
          else
            python verified_history.py
          fi
      - name: Check official quarterly releases for every active issuer
        id: official
        continue-on-error: true
        env:
          SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python official_sync.py --full
      - name: Validate the complete publication bundle
        id: validate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python validate_quarterly_data.py
      - name: Commit verified data and source health
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json sp500_mapping.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update quarterly earnings and source health [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
      - name: Report source failure visibly
        if: steps.official.outcome == 'failure' || steps.discovery.outcome == 'failure'
        run: exit 1
