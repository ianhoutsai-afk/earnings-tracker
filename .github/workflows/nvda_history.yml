name: Official Quarterly History

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Official-source sync or connection diagnostics'
        type: choice
        options: [sync, preflight]
        default: sync
      full:
        description: 'Check every active issuer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: earnings-data-write
  cancel-in-progress: false

jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - name: Install dependencies
        run: python -m pip install lxml requests pandas yfinance
      - name: Verify quarterly policies and official parsers
        run: python -m unittest test_quarterly_policy test_official_sources test_official_sync test_nvda_history -q
      - name: Check SEC connections without revealing configuration
        if: inputs.mode == 'preflight'
        run: |
          python - <<'PY'
          import json
          from official_sync import fetch_sec
          endpoints = {
              'submissions': 'https://data.sec.gov/submissions/CIK0000320193.json',
              'quarterly_filing': 'https://www.sec.gov/Archives/edgar/data/320193/000032019326000013/aapl-20260328.htm',
          }
          results = []
          for kind, url in endpoints.items():
              try:
                  body = fetch_sec(url)
                  results.append({'source':kind, 'available':bool(body)})
              except Exception as exc:
                  results.append({'source':kind, 'available':False, 'errorType':type(exc).__name__})
          print(json.dumps(results))
          if not all(row['available'] for row in results):
              raise SystemExit('Official SEC connection unavailable; configuration values were not logged')
          PY
      - name: Refresh officially verified quarterly history
        id: sync
        if: inputs.mode != 'preflight'
        continue-on-error: true
        run: |
          if [[ "${{ inputs.full }}" == "true" ]]; then
            python official_sync.py --full
          else
            python official_sync.py
          fi
      - name: Validate publication bundle
        id: validate
        if: ${{ !cancelled() && inputs.mode != 'preflight' }}
        run: python validate_quarterly_data.py
      - name: Publish verified data and honest source status
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.mode != 'preflight' && steps.validate.outcome == 'success' }}
        run: |
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json sp500_mapping.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update official quarterly history and source status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/cache/save@v4
        if: ${{ always() && inputs.mode != 'preflight' }}
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
      - name: Keep check results for review
        if: ${{ always() && inputs.mode != 'preflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-quarterly-check
          path: official_scan_state.json
      - name: Fail visibly when an official source was unavailable
        if: steps.sync.outcome == 'failure'
        run: exit 1
