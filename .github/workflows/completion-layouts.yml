name: Reviewed release layout diagnostics
on:
  push:
    branches: [codex/quarterly-completion-20261104]
    paths: ['diagnose_release_layouts.py']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install lxml
      - run: python diagnose_release_layouts.py
