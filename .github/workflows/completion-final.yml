name: Final quarterly source completion
on:
  push:
    branches: [codex/quarterly-completion-20261104]
    paths: ['.github/workflows/completion-final.yml']
permissions: {contents: write}
jobs:
  final-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install lxml requests pandas yfinance
      - run: python -m unittest discover -q
      - run: node --test test_*.mjs
      - name: Reconcile current production facts and quarter windows
        run: python reconcile_quarterly_publication.py
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python official_sync.py --full
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
      - name: Clear expired publication fields without rebuilding history status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from quarterly_policy import company_fields
          from verified_history import write_json_bundle
          today=datetime.now(ZoneInfo('America/New_York')).date()
          history=json.loads(Path('historical_data.json').read_text())
          companies=json.loads(Path('data.json').read_text())
          write_json_bundle({Path('data.json'):[company_fields(c,history,today) for c in companies]})
          PY
      - run: python validate_quarterly_data.py
      - run: python final_candidate_audit.py
      - name: Preserve audited data on isolated run branch
        if: always()
        run: |
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json sp500_mapping.json docs/quarterly-completion-final-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve reconciled final quarterly candidate'
          git push origin HEAD:refs/heads/codex/quarterly-final-${{ github.run_id }}
