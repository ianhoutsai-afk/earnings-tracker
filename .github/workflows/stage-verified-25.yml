name: Stage verified quarterly EPS for release
on:
  push:
    branches: [codex/publish-25-quarterly-eps-20261114]
    paths: ['.github/workflows/stage-verified-25.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply verified original-release evidence
        run: |
          git fetch --depth=1 origin ad0235d7cf2402155c3e5ae4725b5fb94b8ef909
          mkdir -p ../seed
          git archive FETCH_HEAD docs/complete-25-issuer-financials-2026-11-09.json docs/evidence-complete-25-issuers-2026-11-09 | tar -x -C ../seed
          python publish25.py
          python -m unittest discover -q
          node --test test_*.mjs
          python validate_quarterly_data.py
          git rm publish25.py .github/workflows/stage-verified-25.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json docs/complete-25-issuer-financials-2026-11-14.json docs/evidence-complete-25-issuers-2026-11-09
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish 25 verified quarterly diluted EPS values'
          git push origin HEAD
