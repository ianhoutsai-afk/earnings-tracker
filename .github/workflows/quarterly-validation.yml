name: Quarterly Data Validation
on:
  pull_request:
  push:
    branches: [main]
    paths: ['*.py', '*.mjs', 'index.html', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quarterly-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lxml requests pandas yfinance
      - name: Python regressions
        run: python -m unittest discover -q
      - name: JavaScript regressions
        run: node --test test_*.mjs
      - name: Publication consistency
        run: python validate_quarterly_data.py --snapshot-date
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static Pages assets
        run: |
          node scripts/build-site.mjs
          npx --yes tailwindcss@3.4.19 -c scripts/tailwind.config.cjs -i scripts/tailwind.css -o _site/tracker.css --minify
