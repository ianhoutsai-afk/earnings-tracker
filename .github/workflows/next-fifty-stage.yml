name: Validate the next fifty-company quarterly backfill
on:
  push:
    branches: [codex/verified-next-50-companies-20261107]
    paths: ['stage_next.py','.github/workflows/next-fifty-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install lxml requests pandas yfinance
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: next-fifty-stage-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python complete_next_revenue.py
      - run: python stage_next.py
      - run: python -m unittest discover -q
      - run: node --test test_*.mjs
      - run: python validate_quarterly_data.py
      - run: |
          git rm -f collect_next.py next-candidates.json complete_next_revenue.py selected-next-fifty.json stage_next.py .github/workflows/next-fifty-collect.yml .github/workflows/next-fifty-stage.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json data.json docs/next-fifty-company-backfill-2026-11-07.json docs/evidence-next-fifty-companies-2026-11-07
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete the next fifty-company quarterly backfill'
          git push origin HEAD
