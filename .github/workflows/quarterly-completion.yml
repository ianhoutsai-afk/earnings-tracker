name: Quarterly Completion Verification
on:
  push:
    branches: ['codex/quarterly-data-completion-20261030']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quarterly-completion-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-completion-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python -m pip install lxml requests pandas yfinance
      - name: Quarterly regression suite
        run: python -m unittest discover -q
      - name: Validate baseline publication
        run: python validate_quarterly_data.py
      - name: Real-source latest-quarter smoke check
        run: python diagnose_quarterly_completion.py
      - name: Backfill every issuer on this branch
        run: python verify_quarterly_completion.py
      - name: Validate backfill
        run: python validate_quarterly_data.py
      - name: Publish reviewable branch data
        if: github.ref == 'refs/heads/codex/quarterly-data-completion-20261030'
        run: |
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json sp500_mapping.json docs/quarterly-completion-results.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill verified quarterly coverage for review [skip ci]'
          git push origin HEAD:codex/quarterly-data-completion-20261030
