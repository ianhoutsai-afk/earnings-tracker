name: Quarterly Completion Verification
on:
  push:
    branches: ['codex/quarterly-data-completion-20261030']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quarterly-completion-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lxml requests pandas yfinance
      - name: Existing regression baseline
        run: python -m unittest discover -q
      - name: Validate baseline publication
        run: python validate_quarterly_data.py
      - name: Read-only source diagnostics
        run: python diagnose_quarterly_completion.py
