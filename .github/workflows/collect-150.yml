name: Collect at most 150 official metric evidence items
on:
  push:
    branches: [codex/fill-150-official-metrics-20261105]
    paths: ['collect_150_evidence.py','.github/workflows/collect-150.yml']
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_PROXY_URL: ${{ secrets.SEC_PROXY_URL }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install lxml requests pandas yfinance
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python collect_150_evidence.py
      - run: |
          git add audit-150/candidates.json audit-150/layout-debug.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage up to 150 official source evidence items without changing site data'
          git push origin HEAD
