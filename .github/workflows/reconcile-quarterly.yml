name: Reconcile Quarterly Publication
on:
  push:
    branches: ['codex/quarterly-metrics-events-20261030']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lxml requests pandas yfinance
      - name: Verify corrected code
        run: |
          python -m unittest discover -q
          node --test test_*.mjs
      - name: Reconcile current main without losing verified quarters
        run: |
          git fetch origin main
          python reconcile_quarterly_publication.py
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile current main quarterly publication data [skip ci]' || true
          git merge -s ours --no-edit origin/main
          python validate_quarterly_data.py
          git push origin HEAD:codex/quarterly-metrics-events-20261030
