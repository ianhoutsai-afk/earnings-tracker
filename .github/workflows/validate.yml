name: Quarterly Data Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: Publication, parser, retention and progress regressions
        run: python -m unittest discover
      - name: Browser data and bilingual interface regressions
        run: node --test test*.mjs
      - name: Validate complete data bundle
        run: python validate_quarterly_data.py
