name: Verify the next 50 quarterly earnings updates
on:
  push:
    branches: [codex/complete-next-50-quarterly-20261114]
    paths: ['.github/workflows/stage-next-quarterly-50.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python apply_next_50.py
          python -m unittest discover -q
          node --test test_*.mjs
          python validate_quarterly_data.py
          git rm apply_next_50.py reviewed_next_50.json .github/workflows/stage-next-quarterly-50.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json docs/complete-next-50-issuer-financials-2026-11-14.json docs/evidence-complete-next-50-issuers-2026-11-14
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete financial data for another 50 issuers'
          git push origin HEAD
