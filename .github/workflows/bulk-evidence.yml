name: Apply and validate audited official data completion
on:
  push:
    branches: [codex/official-data-completion-20261107]
    paths: ['bulk_stage.py','.github/workflows/bulk-evidence.yml']
permissions: {contents: write}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install lxml requests pandas yfinance
      - name: Apply only audited null-to-number fields
        run: python bulk_stage.py --apply
      - name: Python regressions
        run: python -m unittest discover -q
      - name: JavaScript regressions
        run: node --test test_*.mjs
      - name: Publication consistency
        run: python validate_quarterly_data.py
      - name: Retain verified data and evidence only
        run: |
          git rm -r --cached audit-bulk
          git rm bulk_evidence.py bulk_expand.py bulk_stage.py .github/workflows/bulk-evidence.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json data.json docs/data-backfill-2026-11-07.json docs/evidence-2026-11-07 docs/superpowers/plans/2026-11-07-official-data-completion.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fill audited official revenue and GAAP diluted EPS gaps with per-field source evidence'
          git push origin HEAD
