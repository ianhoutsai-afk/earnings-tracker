name: Quarterly Metrics and Events Verification
on:
  push:
    branches: ['codex/quarterly-metrics-events-20261030']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quarterly-metrics-events-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-metrics-${{ github.run_id }}
          restore-keys: sec-official-v1-
      - run: python -m pip install lxml requests pandas yfinance
      - name: Quarterly regression suite
        run: python -m unittest discover -q
      - name: Validate publication
        run: python validate_quarterly_data.py
      - name: Latest official-quarter smoke check
        run: python diagnose_quarterly_completion.py
      - name: Backfill all issuers and compare coverage
        run: python verify_quarterly_completion.py
      - name: Validate final publication bundle
        run: python validate_quarterly_data.py
      - name: Verify critical issuer replay
        run: python replay_quarterly_completion.py
      - name: Save official archive cache
        uses: actions/cache/save@v4
        with:
          path: .sec_cache/official
          key: sec-official-v1-metrics-${{ github.run_id }}
      - name: Save validated data to review branch
        if: github.ref == 'refs/heads/codex/quarterly-metrics-events-20261030'
        run: |
          git add data.json historical_data.json official_history.json history_status.json official_scan_state.json sp500_mapping.json docs/quarterly-completion-results.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish validated quarterly completion data for review [skip ci]'
          git push origin HEAD:codex/quarterly-metrics-events-20261030
