name: Stage 50 verified quarterly earnings updates
on:
  push:
    branches: [codex/complete-50-quarterly-20261114]
    paths: ['.github/workflows/stage-quarterly-50.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply and verify reviewed quarterly data
        run: |
          git fetch --depth=1 origin d21934dd7636498b9a2c69e35c27ed258a30d0aa
          git show FETCH_HEAD:complete25-candidates.json > ../complete25-candidates.json
          mv reviewed-quarterly-50.json ../review.json
          python apply_quarterly_50.py
          python -m unittest discover -q
          node --test test_*.mjs
          python validate_quarterly_data.py
          git rm -f apply_quarterly_50.py reviewed-quarterly-50.json .github/workflows/stage-quarterly-50.yml
          git add official_history.json historical_data.json history_status.json official_scan_state.json docs/complete-50-issuer-financials-2026-11-14.json docs/evidence-complete-50-issuers-2026-11-14
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete five quarters of financial data for 50 issuers'
          git push origin HEAD
