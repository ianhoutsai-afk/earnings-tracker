<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏观与微观看板 | Earnings & Macro Tracker</title>
    <!-- 引入 Tailwind CSS 框架用于快速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Day.js 用于处理时间倒数与时区 -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/duration.js"></script>
    <!-- 引入 Phosphor Icons 图标库 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* 隐藏滚动条但保留滚动功能 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- ================= 顶部导航栏 ================= -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-700 flex items-center">
                <i class="ph-fill ph-chart-line-up mr-2 text-blue-600"></i>
                Earnings Tracker
                <span class="hidden sm:inline ml-2 text-sm text-gray-400 font-normal border-l pl-2">宏观与微观看板</span>
            </h1>
            <div class="text-xs sm:text-sm text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full flex items-center">
                <i class="ph ph-clock mr-1"></i>
                数据更新: <span id="last-updated" class="font-mono text-gray-700 ml-1">加载中...</span>
            </div>
        </div>
    </nav>

    <!-- ================= 网页主体内容 ================= -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- ⭐ 区块一：全球核心央行动态 (横向滑动卡片) ⭐ -->
        <section class="mb-10">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="ph-fill ph-globe-hemisphere-west text-red-600 mr-2 text-xl"></i>
                    全球核心央行动态
                </h2>
                <span class="text-xs text-gray-400">本地时区: <span id="user-timezone" class="font-mono"></span></span>
            </div>
            
            <div id="macro-cards-container" class="flex overflow-x-auto space-x-4 pb-4 scrollbar-hide">
                <!-- 数据加载时的骨架屏提示 -->
                <div class="text-sm text-gray-400 w-full p-4 border border-dashed border-gray-300 rounded-xl text-center">
                    <i class="ph ph-spinner animate-spin inline-block"></i> 正在读取宏观数据...
                </div>
            </div>
        </section>

        <hr class="border-gray-200 mb-8">

        <!-- 🏢 区块二：企业财报追踪 (支持搜索的表格) 🏢 -->
        <section>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 space-y-3 sm:space-y-0">
                <h2 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="ph-fill ph-buildings text-blue-600 mr-2 text-xl"></i>
                    企业财报追踪 (S&P 500)
                </h2>
                <!-- 搜索框 -->
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="输入代码或公司名称..." 
                           class="pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm w-full sm:w-64">
                </div>
            </div>

            <!-- 表格容器 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200 text-xs uppercase text-gray-500">
                            <tr>
                                <th class="px-6 py-4 font-semibold">代码 (Ticker)</th>
                                <th class="px-6 py-4 font-semibold">公司名称</th>
                                <th class="px-6 py-4 font-semibold">行业板块</th>
                                <th class="px-6 py-4 font-semibold">财报日期</th>
                                <th class="px-6 py-4 font-semibold">盘前/盘后</th>
                                <th class="px-6 py-4 font-semibold">倒数天数</th>
                                <th class="px-6 py-4 font-semibold">最新 SEC 财报</th>
                            </tr>
                        </thead>
                        <tbody id="earnings-tbody" class="divide-y divide-gray-100 text-sm">
                            <!-- 财报数据将通过 JS 渲染在这里 -->
                            <tr>
                                <td colspan="7" class="px-6 py-10 text-center text-gray-400">
                                    <i class="ph ph-spinner animate-spin inline-block text-xl mb-2"></i><br>
                                    正在同步微观财报数据...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- ================= 核心 JavaScript 逻辑 ================= -->
    <script>
        // 激活 Day.js 倒计时插件
        dayjs.extend(window.dayjs_plugin_duration);
        
        // 显示用户当前时区
        document.getElementById('user-timezone').innerText = Intl.DateTimeFormat().resolvedOptions().timeZone;

        let globalEarningsData = []; // 用于搜索过滤的全局变量

        // -----------------------------------------
        // 功能 1：获取并渲染【宏观央行数据】
        // -----------------------------------------
        async function loadMacroData() {
            try {
                const response = await fetch('macro_data.json'); 
                if (!response.ok) throw new Error("无法读取 macro_data.json");
                const data = await response.json();
                
                const container = document.getElementById('macro-cards-container');
                let html = '';

                data.forEach(bank => {
                    const target = dayjs(bank.nextDate);
                    const now = dayjs();
                    const diff = target.diff(now);
                    
                    let timeText = '';
                    let isUrgent = false;

                    // 倒计时逻辑：大于1天显示天数，小于1天显示时分
                    if (diff <= 0) {
                        timeText = '正在发布 / 已发布';
                    } else {
                        const d = dayjs.duration(diff);
                        const days = Math.floor(d.asDays());
                        if (days >= 1) {
                            timeText = `${days} 天 ${d.hours()} 小时`;
                        } else {
                            timeText = `${d.hours()} 小时 ${d.minutes()} 分钟`;
                            isUrgent = true; 
                        }
                    }

                    // 卡片 HTML 模板
                    html += `
                    <div class="flex-none w-72 bg-white border ${isUrgent ? 'border-red-400 shadow-md bg-red-50' : 'border-gray-200 hover:shadow-md'} rounded-xl p-5 relative transition-all duration-300">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-base font-bold text-gray-800">${bank.flag} ${bank.name}</span>
                            <span class="text-xs ${isUrgent ? 'bg-red-600 text-white animate-pulse' : 'bg-gray-100 text-gray-600'} px-2 py-1 rounded font-medium shadow-sm">
                                ${timeText}
                            </span>
                        </div>
                        <div class="flex flex-col mb-1">
                            <span class="text-xs text-gray-500 mb-1">当前基准利率</span>
                            <span class="text-2xl font-black text-blue-700 font-mono">${bank.rate}</span>
                        </div>
                        <div class="mt-4 text-xs text-gray-400 border-t border-gray-100 pt-3 flex items-center">
                            <i class="ph-fill ph-clock-countdown mr-1.5 text-gray-500"></i>
                            决议时间: <span class="ml-1 font-medium text-gray-600">${target.format('MM-DD HH:mm')}</span>
                        </div>
                    </div>`;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error("宏观数据加载失败:", error);
                document.getElementById('macro-cards-container').innerHTML = 
                    `<div class="text-red-500 text-sm p-4 w-full text-center bg-red-50 rounded-lg">⚠️ 等待 update_data.py 生成宏观数据...</div>`;
            }
        }

        // -----------------------------------------
        // 功能 2：获取并渲染【微观财报数据】
        // -----------------------------------------
        async function loadEarningsData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("无法读取 data.json");
                const data = await response.json();
                
                // 更新顶部最后更新时间
                document.getElementById('last-updated').innerText = dayjs(data.last_updated).format('YYYY-MM-DD HH:mm');
                
                globalEarningsData = data.companies;
                renderEarningsTable(globalEarningsData);
            } catch (error) {
                console.error("财报数据加载失败:", error);
                document.getElementById('earnings-tbody').innerHTML = 
                    `<tr><td colspan="7" class="px-6 py-8 text-center text-red-500 bg-red-50">⚠️ 无法加载微观财报数据，请确认 data.json 是否存在。</td></tr>`;
            }
        }

        function renderEarningsTable(companies) {
            const tbody = document.getElementById('earnings-tbody');
            let html = '';

            // 数据排序逻辑：按照倒数天数从小到大排序，“未知(N/A)”排在最后
            const sortedCompanies = [...companies].sort((a, b) => {
                const aDays = (a.days_left === 'N/A') ? 9999 : a.days_left;
                const bDays = (b.days_left === 'N/A') ? 9999 : b.days_left;
                return aDays - bDays;
            });

            if (sortedCompanies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">沒有找到相符的公司資料</td></tr>`;
                return;
            }

            sortedCompanies.forEach(company => {
                // 1. 处理盘前/盘后标签
                let timingBadge = '';
                if (company.timing === 'BMO') {
                    timingBadge = `<span class="bg-orange-100 text-orange-700 px-2.5 py-1 rounded-md text-xs font-semibold">盘前 (BMO)</span>`;
                } else if (company.timing === 'AMC') {
                    timingBadge = `<span class="bg-purple-100 text-purple-700 px-2.5 py-1 rounded-md text-xs font-semibold">盘后 (AMC)</span>`;
                } else {
                    timingBadge = `<span class="bg-gray-100 text-gray-500 px-2.5 py-1 rounded-md text-xs">未知</span>`;
                }

                // 2. 处理倒数天数高亮 (3天内标红)
                let daysText = '';
                if (company.days_left === 'N/A') {
                    daysText = `<span class="text-gray-400">官方确认中</span>`;
                } else if (company.days_left <= 3) {
                    daysText = `<span class="text-red-600 font-bold bg-red-50 px-2 py-1 rounded">${company.days_left} 天</span>`;
                } else {
                    daysText = `<span class="text-gray-700 font-medium">${company.days_left} 天</span>`;
                }

                // 3. 处理 SEC 历史链接 (只拿最近一次的记录)
                let secLink = '<span class="text-gray-300">-</span>';
                if (company.history && company.history.length > 0) {
                    const latestReport = company.history[0];
                    secLink = `<a href="${latestReport.html_url}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center transition-colors">
                                  <i class="ph ph-file-text mr-1"></i> ${latestReport.type}
                               </a>`;
                }

                html += `
                <tr class="hover:bg-blue-50 transition-colors group">
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-blue-700">${company.ticker}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-800 font-medium">${company.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-xs">${company.sector}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-700">${company.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${timingBadge}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${daysText}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${secLink}</td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // -----------------------------------------
        // 功能 3：搜索过滤功能
        // -----------------------------------------
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filteredData = globalEarningsData.filter(company => {
                return company.ticker.toLowerCase().includes(keyword) || 
                       company.name.toLowerCase().includes(keyword) ||
                       company.sector.toLowerCase().includes(keyword);
            });
            renderEarningsTable(filteredData);
        });

        // -----------------------------------------
        // 初始化运行
        // -----------------------------------------
        loadMacroData();
        loadEarningsData();
        
        // 每 1 分钟自动刷新一次宏观倒计时 (无需刷新页面)
        setInterval(loadMacroData, 60000);

    </script>
</body>
</html>
