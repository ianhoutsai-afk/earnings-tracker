<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Earnings Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 850: '#1f2937' } } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .expand-row.hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 md:p-8 font-sans transition-colors duration-300">
    <div class="max-w-[1200px] mx-auto">

        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 data-i18n="app.title" class="text-3xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">📈 Corporate Earnings Tracker</h1>
            <div class="flex items-center gap-2">
                <button id="language-toggle" type="button" aria-label="Switch to Traditional Chinese" class="min-w-14 px-3 py-2 text-sm font-semibold bg-blue-600 text-white border border-blue-600 rounded-lg shadow-sm hover:bg-blue-700 hover:border-blue-700 transition">
                    中文
                </button>
                <button id="theme-toggle" data-i18n="theme.toggle" type="button" class="px-4 py-2 text-sm font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    Toggle light/dark mode
                </button>
            </div>
        </div>

        <!-- 搜尋、排序與篩選工具列 -->
        <div class="mb-4 bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1 min-w-0">
                    <label for="company-search" data-i18n="search.label" class="sr-only">Search by company name or ticker</label>
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.5-3.5"></path>
                    </svg>
                    <input
                        id="company-search"
                        type="search"
                        autocomplete="off"
                        spellcheck="false"
                        data-i18n-placeholder="search.placeholder"
                        placeholder="Search by company name or ticker, for example Apple or AAPL"
                        class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 py-2 pl-10 pr-10 outline-none transition"
                    >
                    <button id="clear-search-btn" type="button" data-i18n-aria-label="search.clear" aria-label="Clear search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 items-center justify-center rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-200 dark:hover:text-gray-200 dark:hover:bg-gray-700 transition">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                    <div class="flex items-center gap-2">
                        <label for="sort-select" data-i18n="sort.label" class="text-sm font-medium text-gray-600 dark:text-gray-400 whitespace-nowrap">Sort by:</label>
                        <select id="sort-select" class="w-full sm:w-auto bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 outline-none">
                            <option value="countdown_asc" data-i18n="sort.countdownAsc">Report date (nearest first)</option>
                            <option value="countdown_desc" data-i18n="sort.countdownDesc">Report date (farthest first)</option>
                            <option value="alpha_asc" data-i18n="sort.alphaAsc">Ticker (A–Z)</option>
                            <option value="alpha_desc" data-i18n="sort.alphaDesc">Ticker (Z–A)</option>
                        </select>
                    </div>

                    <button id="star-filter-btn" class="px-3 py-2 text-sm font-medium bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:text-yellow-600 dark:hover:text-yellow-400 transition whitespace-nowrap">
                        ⭐ Watchlist only
                    </button>
                </div>
            </div>

            <p id="search-status" data-i18n="search.loading" class="mt-2 px-1 text-xs text-gray-500 dark:text-gray-400" aria-live="polite">
                Loading company data...
            </p>
        </div>

        <div class="w-full overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-850 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                        <th data-i18n="table.watch" class="p-4 font-semibold w-12 text-center">Watch</th>
                        <th data-i18n="table.company" class="p-4 font-semibold">Company</th>
                        <th data-i18n="table.reportDate" class="p-4 font-semibold">Expected report date</th>
                        <th data-i18n="table.eps" class="p-4 font-semibold">Estimated EPS</th>
                        <th data-i18n="table.revenue" class="p-4 font-semibold">Estimated revenue</th>
                        <th data-i18n="table.sec" class="p-4 font-semibold text-center">SEC filings</th>
                    </tr>
                </thead>
                <tbody id="data-container" class="text-sm">
                    <tr>
                        <td colspan="6" data-i18n="table.loading" class="p-8 text-center text-gray-400">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import {
            createLanguageController,
            getExpandedTickers,
            restoreExpandedTickers,
        } from './i18n.mjs';

        // 深淺色模式
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // 全域狀態
        let appData = [];
        let historicalData = {};
        let starFilterActive = false;
        let searchQuery = '';
        let currentLanguage = 'en';
        let t;

        function applyStaticTranslations() {
            document.documentElement.lang = currentLanguage;
            document.title = t('page.title');

            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });

            document
                .querySelectorAll('[data-i18n-placeholder]')
                .forEach(node => {
                    node.placeholder = t(node.dataset.i18nPlaceholder);
                });

            document
                .querySelectorAll('[data-i18n-aria-label]')
                .forEach(node => {
                    node.setAttribute(
                        'aria-label',
                        t(node.dataset.i18nAriaLabel)
                    );
                });
        }

        function updateLanguageToggle() {
            const button = document.getElementById('language-toggle');
            button.textContent = t('language.button');
            button.setAttribute('aria-label', t('language.label'));
        }

        // 客戶端倒計時計算
        function calcCountdown(reportDateStr) {
            if (!reportDateStr) return null;

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const reportDate = new Date(reportDateStr + 'T00:00:00');
            return Math.ceil((reportDate - today) / (1000 * 60 * 60 * 24));
        }

        function getCountdownBadgeHtml(countdown) {
            if (countdown === null || countdown === undefined) return '';

            if (countdown === 0) {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">${t('countdown.today')}</span>`;
            }

            if (countdown > 0 && countdown <= 7) {
                const label = countdown === 1
                    ? t('countdown.day')
                    : t('countdown.days', { count: countdown });
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400 border border-orange-200 dark:border-orange-800">${label}</span>`;
            }

            if (countdown > 7) {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400 border border-blue-200 dark:border-blue-800">${t('countdown.days', { count: countdown })}</span>`;
            }

            return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-400 border border-gray-200 dark:border-gray-700">${t('countdown.published')}</span>`;
        }

        // 展開或折疊歷史面板
        window.toggleHistory = function(ticker) {
            const row = document.getElementById(`history-${ticker}`);
            const icon = document.getElementById(`icon-${ticker}`);

            if (!row || !icon) return;

            if (row.classList.contains('hidden')) {
                row.classList.remove('hidden');
                icon.textContent = '▲';
                icon.classList.add(
                    'bg-blue-100',
                    'text-blue-600',
                    'dark:bg-blue-900',
                    'dark:text-blue-400'
                );
            } else {
                row.classList.add('hidden');
                icon.textContent = '▼';
                icon.classList.remove(
                    'bg-blue-100',
                    'text-blue-600',
                    'dark:bg-blue-900',
                    'dark:text-blue-400'
                );
            }
        };

        function getHistory(ticker) {
            return historicalData[ticker] || [];
        }

        function updateStarFilterBtn() {
            const btn = document.getElementById('star-filter-btn');

            if (starFilterActive) {
                btn.classList.add(
                    'bg-yellow-100',
                    'dark:bg-yellow-900/30',
                    'text-yellow-700',
                    'dark:text-yellow-300',
                    'border-yellow-300',
                    'dark:border-yellow-700'
                );
                btn.classList.remove(
                    'bg-white',
                    'dark:bg-gray-900',
                    'text-gray-600',
                    'dark:text-gray-400'
                );
                btn.textContent = t('filter.showAll');
            } else {
                btn.classList.remove(
                    'bg-yellow-100',
                    'dark:bg-yellow-900/30',
                    'text-yellow-700',
                    'dark:text-yellow-300',
                    'border-yellow-300',
                    'dark:border-yellow-700'
                );
                btn.classList.add(
                    'bg-white',
                    'dark:bg-gray-900',
                    'text-gray-600',
                    'dark:text-gray-400'
                );
                btn.textContent = t('filter.onlyFavorites');
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        // 忽略大小寫、空格及標點符號
        function normalizeSearchValue(value) {
            return String(value || '')
                .normalize('NFKD')
                .toLowerCase()
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
        }

        function companyMatchesSearch(company, query) {
            if (!query) return true;

            const normalizedQuery = normalizeSearchValue(query);
            if (!normalizedQuery) return true;

            return normalizeSearchValue(company.ticker).includes(normalizedQuery)
                || normalizeSearchValue(company.name).includes(normalizedQuery);
        }

        function updateSearchUi(resultCount) {
            const clearBtn = document.getElementById('clear-search-btn');
            const status = document.getElementById('search-status');

            clearBtn.classList.toggle('hidden', searchQuery.length === 0);
            clearBtn.classList.toggle('flex', searchQuery.length > 0);

            if (searchQuery) {
                const key = resultCount === 1
                    ? 'search.resultOne'
                    : 'search.results';
                status.textContent = t(key, {
                    count: resultCount,
                    query: searchQuery,
                });
            } else if (starFilterActive) {
                const key = resultCount === 1
                    ? 'search.starredOne'
                    : 'search.starred';
                status.textContent = t(key, { count: resultCount });
            } else {
                const key = resultCount === 1
                    ? 'search.allOne'
                    : 'search.all';
                status.textContent = t(key, { count: resultCount });
            }
        }

        function renderTable(data) {
            const container = document.getElementById('data-container');
            container.innerHTML = '';

            if (data.length === 0) {
                const hasSearch = searchQuery.length > 0;
                const emptyMessage = hasSearch
                    ? t('empty.searchTitle', {
                        query: escapeHtml(searchQuery),
                    })
                    : t('empty.filteredTitle');
                const emptyHint = hasSearch
                    ? t('empty.searchHint')
                    : t('empty.filterHint');

                container.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-12 text-center">
                            <div class="text-base font-semibold text-gray-700 dark:text-gray-200">
                                ${emptyMessage}
                            </div>
                            <div class="mt-1 text-sm text-gray-400">
                                ${emptyHint}
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach(company => {
                const isStarred =
                    localStorage.getItem(`star_${company.ticker}`) === 'true';
                const starIcon = isStarred ? '⭐' : '☆';

                const countdown = calcCountdown(company.reportDate);
                const badgeHtml = getCountdownBadgeHtml(countdown);

                const history = getHistory(company.ticker);
                const hasHistory = history.length > 0;

                const secBtnHtml = hasHistory
                    ? `
                        <button onclick="toggleHistory('${company.ticker}')" class="px-3 py-1.5 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center mx-auto text-gray-600 dark:text-gray-300 text-xs font-medium">
                            ${t('sec.view')}
                            <span id="icon-${company.ticker}" class="ml-1 w-5 h-5 flex items-center justify-center rounded transition-colors">▼</span>
                        </button>
                    `
                    : `<span class="text-xs text-gray-400">${t('sec.noData')}</span>`;

                const tr = document.createElement('tr');
                tr.className =
                    'border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors duration-150';

                tr.innerHTML = `
                    <td class="p-4 text-center cursor-pointer text-lg star-btn select-none" data-ticker="${company.ticker}">
                        ${starIcon}
                    </td>
                    <td class="p-4">
                        <span class="font-bold text-gray-900 dark:text-gray-100">
                            ${company.name || company.ticker}
                        </span>
                        <span class="text-gray-500 dark:text-gray-400 ml-1 text-xs">
                            (${company.ticker})
                        </span>
                        ${badgeHtml}
                    </td>
                    <td class="p-4 text-gray-800 dark:text-gray-300 font-medium">
                        ${company.reportDate || '-'}
                        ${
                            company.bmo_amc
                                ? `<span class="ml-1 text-xs">${company.bmo_amc}</span>`
                                : ''
                        }
                    </td>
                    <td class="p-4 text-gray-700 dark:text-gray-300">
                        ${company.eps || '-'}
                    </td>
                    <td class="p-4 text-gray-700 dark:text-gray-300">
                        ${company.revenue || '-'}
                    </td>
                    <td class="p-4 text-center">${secBtnHtml}</td>
                `;

                const trExpand = document.createElement('tr');
                trExpand.id = `history-${company.ticker}`;
                trExpand.className =
                    'expand-row hidden bg-gray-50/50 dark:bg-gray-800/40 border-b border-gray-200 dark:border-gray-700';

                let historyContent = '';

                if (hasHistory) {
                    let cardsHtml = '';

                    history.forEach(h => {
                        const secForm = h.form || null;
                        const isAnnualFiling =
                            secForm === '10-K'
                            || (!secForm && (h.quarter || '').includes('FY'));

                        const filingLabel = isAnnualFiling
                            ? t('sec.annual')
                            : t('sec.quarterly');

                        const secUrl = h.secUrl || null;

                        cardsHtml += `
                            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center text-center h-full">
                                <span class="text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 ${
                                    isAnnualFiling
                                        ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400'
                                        : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'
                                }">
                                    ${filingLabel}
                                </span>

                                <div class="text-xs text-gray-500 dark:text-gray-400 mb-3">
                                    📅 ${h.date}
                                </div>

                                <div class="text-2xl font-extrabold text-gray-900 dark:text-gray-100 mb-1">
                                    ${h.eps_reported}
                                </div>
                                <div class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3">
                                    EPS
                                </div>

                                <div class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-1">
                                    ${h.revenue_reported || '-'}
                                </div>
                                <div class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">
                                    ${t('sec.revenue')}
                                </div>

                                ${
                                    secUrl
                                        ? `
                                            <a href="${secUrl}" target="_blank"
                                               class="mt-auto inline-flex items-center justify-center w-full px-3 py-2 text-xs font-medium text-blue-600 bg-blue-50 dark:bg-blue-900/20 dark:text-blue-400 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">
                                                ${t('sec.original')}
                                            </a>
                                        `
                                        : `
                                            <span class="mt-auto inline-flex items-center justify-center w-full px-3 py-2 text-xs text-gray-400 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                                                ${
                                                    h.secStatus === 'pending'
                                                        ? t('sec.pending')
                                                        : t('sec.noOriginal')
                                                }
                                            </span>
                                        `
                                }
                            </div>
                        `;
                    });

                    historyContent = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 p-5 inner-shadow">
                            ${cardsHtml}
                        </div>
                    `;
                }

                trExpand.innerHTML = `
                    <td colspan="6" class="p-0">${historyContent}</td>
                `;

                container.appendChild(tr);
                container.appendChild(trExpand);
            });

            document.querySelectorAll('.star-btn').forEach(btn => {
                btn.addEventListener('click', event => {
                    const ticker = event.target.getAttribute('data-ticker');
                    const key = `star_${ticker}`;

                    if (localStorage.getItem(key) === 'true') {
                        localStorage.removeItem(key);
                        event.target.textContent = '☆';
                    } else {
                        localStorage.setItem(key, 'true');
                        event.target.textContent = '⭐';
                    }
                });
            });
        }

        function applySort() {
            const sortValue = document.getElementById('sort-select').value;

            let filtered = starFilterActive
                ? appData.filter(
                    company =>
                        localStorage.getItem(`star_${company.ticker}`) === 'true'
                )
                : [...appData];

            filtered = filtered.filter(company =>
                companyMatchesSearch(company, searchQuery)
            );

            if (sortValue === 'countdown_asc') {
                filtered.sort((a, b) => {
                    const valueA = calcCountdown(a.reportDate);
                    const valueB = calcCountdown(b.reportDate);
                    const normalizedA =
                        valueA !== null && valueA >= 0 ? valueA : 99999;
                    const normalizedB =
                        valueB !== null && valueB >= 0 ? valueB : 99999;

                    return normalizedA - normalizedB;
                });
            } else if (sortValue === 'countdown_desc') {
                filtered.sort((a, b) => {
                    const valueA = calcCountdown(a.reportDate);
                    const valueB = calcCountdown(b.reportDate);
                    const normalizedA =
                        valueA !== null ? valueA : -99999;
                    const normalizedB =
                        valueB !== null ? valueB : -99999;

                    return normalizedB - normalizedA;
                });
            } else if (sortValue === 'alpha_asc') {
                filtered.sort((a, b) =>
                    a.ticker.localeCompare(b.ticker)
                );
            } else if (sortValue === 'alpha_desc') {
                filtered.sort((a, b) =>
                    b.ticker.localeCompare(a.ticker)
                );
            }

            updateSearchUi(filtered.length);
            renderTable(filtered);
        }

        document
            .getElementById('star-filter-btn')
            .addEventListener('click', () => {
                starFilterActive = !starFilterActive;
                updateStarFilterBtn();
                applySort();
            });

        function init() {
            let dataLoaded = false;
            let historicalLoaded = false;

            function tryRender() {
                if (dataLoaded && historicalLoaded) {
                    applySort();
                }
            }

            function fetchData(retries = 3) {
                fetch('data.json')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        appData = data;
                        dataLoaded = true;
                        tryRender();
                    })
                    .catch(() => {
                        if (retries > 0) {
                            setTimeout(
                                () => fetchData(retries - 1),
                                2000
                            );
                        } else {
                            document.getElementById(
                                'data-container'
                            ).innerHTML = `
                                <tr>
                                    <td colspan="6" data-i18n="data.error" class="p-8 text-center text-red-500 font-medium">
                                        ${t('data.error')}
                                    </td>
                                </tr>
                            `;
                        }
                    });
            }

            function fetchHistorical() {
                fetch('historical_data.json')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        historicalData = data;
                        historicalLoaded = true;
                        tryRender();
                    })
                    .catch(() => {
                        console.warn(t('data.historyWarning'));
                        historicalLoaded = true;
                        tryRender();
                    });
            }

            fetchData();
            fetchHistorical();
        }

        const languageController = createLanguageController({
            storage: localStorage,
            captureExpanded: () => getExpandedTickers(
                document.querySelectorAll('.expand-row')
            ),
            apply: (language, translator) => {
                currentLanguage = language;
                t = translator;
                applyStaticTranslations();
                updateLanguageToggle();
                updateStarFilterBtn();

                if (appData.length > 0) {
                    applySort();
                }
            },
            restoreExpanded: tickers => restoreExpandedTickers(
                tickers,
                ticker => {
                    const row = document.getElementById(`history-${ticker}`);
                    if (row?.classList.contains('hidden')) {
                        window.toggleHistory(ticker);
                    }
                }
            ),
        });

        document.addEventListener('DOMContentLoaded', () => {
            languageController.initialize();

            document
                .getElementById('language-toggle')
                .addEventListener('click', () => {
                    languageController.toggle();
                });

            document
                .getElementById('sort-select')
                .addEventListener('change', applySort);

            const searchInput =
                document.getElementById('company-search');

            searchInput.addEventListener('input', event => {
                searchQuery = event.target.value.trim();
                applySort();
            });

            searchInput.addEventListener('keydown', event => {
                if (event.key === 'Escape' && searchInput.value) {
                    searchInput.value = '';
                    searchQuery = '';
                    applySort();
                }
            });

            document
                .getElementById('clear-search-btn')
                .addEventListener('click', () => {
                    searchInput.value = '';
                    searchQuery = '';
                    applySort();
                    searchInput.focus();
                });

            init();
        });
    </script>
