<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Earnings Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 850: '#1f2937' } } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .expand-row.hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 md:p-8 font-sans transition-colors duration-300">
    <div class="max-w-[1200px] mx-auto">
        
        <!-- 標題與模式切換 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">📈 企業財報追蹤儀表板</h1>
            <button id="theme-toggle" class="px-4 py-2 text-sm font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                切換日/夜模式
            </button>
        </div>

        <!-- 搜尋、排序與篩選工具列 -->
        <div class="mb-4 bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1 min-w-0">
                    <label for="company-search" class="sr-only">搜尋公司名稱或股票代碼</label>
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.5-3.5"></path>
                    </svg>
                    <input
                        id="company-search"
                        type="search"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="搜尋公司名稱或股票代碼，例如 Apple 或 AAPL"
                        class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 py-2 pl-10 pr-10 outline-none transition"
                    >
                    <button id="clear-search-btn" type="button" aria-label="清除搜尋" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 items-center justify-center rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-200 dark:hover:text-gray-200 dark:hover:bg-gray-700 transition">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                    <div class="flex items-center gap-2">
                        <label for="sort-select" class="text-sm font-medium text-gray-600 dark:text-gray-400 whitespace-nowrap">排序方式：</label>
                        <select id="sort-select" class="w-full sm:w-auto bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 outline-none">
                            <option value="countdown_asc">發布日倒數 (由近到遠)</option>
                            <option value="countdown_desc">發布日倒數 (由遠到近)</option>
                            <option value="alpha_asc">公司代碼 (A - Z)</option>
                            <option value="alpha_desc">公司代碼 (Z - A)</option>
                        </select>
                    </div>
                    <button id="star-filter-btn" class="px-3 py-2 text-sm font-medium bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:text-yellow-600 dark:hover:text-yellow-400 transition whitespace-nowrap">
                        ⭐ 只顯示收藏
                    </button>
                </div>
            </div>
            <p id="search-status" class="mt-2 px-1 text-xs text-gray-500 dark:text-gray-400" aria-live="polite">正在載入公司資料...</p>
        </div>
        
        <!-- 數據表格容器 -->
        <div class="w-full overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-850 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                        <th class="p-4 font-semibold w-12 text-center">關注</th>
                        <th class="p-4 font-semibold">公司名稱</th>
                        <th class="p-4 font-semibold">預計發布日</th>
                        <th class="p-4 font-semibold">預期 EPS</th>
                        <th class="p-4 font-semibold">預估營收</th>
                        <th class="p-4 font-semibold text-center">SEC 財報</th>
                    </tr>
                </thead>
                <tbody id="data-container" class="text-sm">
                    <tr><td colspan="6" class="p-8 text-center text-gray-400">正在載入數據...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 深淺色模式
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // ── 全域狀態 ──
        let appData = [];
        let historicalData = {};
        let starFilterActive = false;
        let searchQuery = '';

        // ── 客戶端倒計時計算 ──
        function calcCountdown(reportDateStr) {
            if (!reportDateStr) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const reportDate = new Date(reportDateStr + 'T00:00:00');
            const diffDays = Math.ceil((reportDate - today) / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function getCountdownBadgeHtml(countdown) {
            if (countdown === null || countdown === undefined) return '';
            if (countdown === 0) {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">今日發布!</span>`;
            } else if (countdown > 0 && countdown <= 7) {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400 border border-orange-200 dark:border-orange-800">倒數 ${countdown} 天</span>`;
            } else if (countdown > 7) {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400 border border-blue-200 dark:border-blue-800">倒數 ${countdown} 天</span>`;
            } else {
                return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-400 border border-gray-200 dark:border-gray-700">已發布</span>`;
            }
        }

        // 展開/折疊歷史面板
        window.toggleHistory = function(ticker) {
            const row = document.getElementById(`history-${ticker}`);
            const icon = document.getElementById(`icon-${ticker}`);
            if (row.classList.contains('hidden')) {
                row.classList.remove('hidden');
                icon.textContent = '▲';
                icon.classList.add('bg-blue-100', 'text-blue-600', 'dark:bg-blue-900', 'dark:text-blue-400');
            } else {
                row.classList.add('hidden');
                icon.textContent = '▼';
                icon.classList.remove('bg-blue-100', 'text-blue-600', 'dark:bg-blue-900', 'dark:text-blue-400');
            }
        };

        // 從 historicalData 取得某公司的歷史資料
        function getHistory(ticker) {
            return historicalData[ticker] || [];
        }

        // 更新收藏篩選按鈕樣式
        function updateStarFilterBtn() {
            const btn = document.getElementById('star-filter-btn');
            if (starFilterActive) {
                btn.classList.add('bg-yellow-100', 'dark:bg-yellow-900/30', 'text-yellow-700', 'dark:text-yellow-300', 'border-yellow-300', 'dark:border-yellow-700');
                btn.classList.remove('bg-white', 'dark:bg-gray-900', 'text-gray-600', 'dark:text-gray-400');
                btn.textContent = '⭐ 顯示全部';
            } else {
                btn.classList.remove('bg-yellow-100', 'dark:bg-yellow-900/30', 'text-yellow-700', 'dark:text-yellow-300', 'border-yellow-300', 'dark:border-yellow-700');
                btn.classList.add('bg-white', 'dark:bg-gray-900', 'text-gray-600', 'dark:text-gray-400');
                btn.textContent = '⭐ 只顯示收藏';
            }
        }

        // ── 渲染表格 ──
        function renderTable(data) {
            const container = document.getElementById('data-container');
            container.innerHTML = '';

            if (data.length === 0) {
                const hasSearch = searchQuery.length > 0;
                const emptyMessage = hasSearch
                    ? `找不到符合「${escapeHtml(searchQuery)}」的公司`
                    : '目前沒有符合條件的公司';
                const emptyHint = hasSearch
                    ? '請確認公司名稱或股票代碼，或嘗試較短的關鍵字。'
                    : '請調整目前的篩選條件。';
                container.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-12 text-center">
                            <div class="text-base font-semibold text-gray-700 dark:text-gray-200">${emptyMessage}</div>
                            <div class="mt-1 text-sm text-gray-400">${emptyHint}</div>
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach(company => {
                const isStarred = localStorage.getItem(`star_${company.ticker}`) === 'true';
                const starIcon = isStarred ? '⭐' : '☆';

                // 1. 客戶端計算倒數
                const countdown = calcCountdown(company.reportDate);
                const badgeHtml = getCountdownBadgeHtml(countdown);

                // 2. 從 historicalData 取得歷史資料
                const history = getHistory(company.ticker);
                const hasHistory = history.length > 0;
                const secBtnHtml = hasHistory
                    ? `<button onclick="toggleHistory('${company.ticker}')" class="px-3 py-1.5 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center mx-auto text-gray-600 dark:text-gray-300 text-xs font-medium">
                            查看 <span id="icon-${company.ticker}" class="ml-1 w-5 h-5 flex items-center justify-center rounded transition-colors">▼</span>
                        </button>`
                    : `<span class="text-xs text-gray-400">暫無資料</span>`;

                // 3. 主資料行
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors duration-150';
                tr.innerHTML = `
                    <td class="p-4 text-center cursor-pointer text-lg star-btn select-none" data-ticker="${company.ticker}">${starIcon}</td>
                    <td class="p-4">
                        <span class="font-bold text-gray-900 dark:text-gray-100">${company.name || company.ticker}</span> 
                        <span class="text-gray-500 dark:text-gray-400 ml-1 text-xs">(${company.ticker})</span>
                        ${badgeHtml}
                    </td>
                    <td class="p-4 text-gray-800 dark:text-gray-300 font-medium">
                        ${company.reportDate || '-'} ${company.bmo_amc ? `<span class="ml-1 text-xs">${company.bmo_amc}</span>` : ''}
                    </td>
                    <td class="p-4 text-gray-700 dark:text-gray-300">${company.eps || '-'}</td>
                    <td class="p-4 text-gray-700 dark:text-gray-300">${company.revenue || '-'}</td>
                    <td class="p-4 text-center">${secBtnHtml}</td>
                `;

                // 4. 歷史展開面板
                const trExpand = document.createElement('tr');
                trExpand.id = `history-${company.ticker}`;
                trExpand.className = 'expand-row hidden bg-gray-50/50 dark:bg-gray-800/40 border-b border-gray-200 dark:border-gray-700';

                let historyContent = '';
                if (hasHistory) {
                    let cardsHtml = '';
                    history.forEach((h) => {
                        const secForm = h.form || null;
                        const isAnnualFiling = secForm === '10-K' || (!secForm && (h.quarter || '').includes('FY'));
                        const filingLabel = isAnnualFiling ? '10-K 年報' : '10-Q 季報';
                        // SEC 連結（指向 ixbrl 互動式檢視器）
                        const secUrl = h.secUrl || null;
                        cardsHtml += `
                            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center text-center h-full">
                                <span class="text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 ${isAnnualFiling ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'}">${filingLabel}</span>
                                <div class="text-xs text-gray-500 dark:text-gray-400 mb-3">
                                    📅 ${h.date}
                                </div>
                                <div class="text-2xl font-extrabold text-gray-900 dark:text-gray-100 mb-1">
                                    ${h.eps_reported}
                                </div>
                                <div class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3">EPS</div>
                                <div class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-1">
                                    ${h.revenue_reported || '-'}
                                </div>
                                <div class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">營收</div>
                                ${secUrl 
                                    ? `<a href="${secUrl}" target="_blank" 
                                          class="mt-auto inline-flex items-center justify-center w-full px-3 py-2 text-xs font-medium text-blue-600 bg-blue-50 dark:bg-blue-900/20 dark:text-blue-400 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">
                                           🏛️ SEC 原文
                                       </a>`
                                    : `<span class="mt-auto inline-flex items-center justify-center w-full px-3 py-2 text-xs text-gray-400 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                                          ${h.secStatus === 'pending' ? '等待 SEC 申報' : '暫無原文'}
                                       </span>`
                                }
                            </div>
                        `;
                    });
                    historyContent = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 p-5 inner-shadow">${cardsHtml}</div>`;
                }

                trExpand.innerHTML = `<td colspan="6" class="p-0">${historyContent}</td>`;

                container.appendChild(tr);
                container.appendChild(trExpand);
            });

            // 重新綁定星星點擊事件
            document.querySelectorAll('.star-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const ticker = e.target.getAttribute('data-ticker');
                    const key = `star_${ticker}`;
                    if (localStorage.getItem(key) === 'true') {
                        localStorage.removeItem(key);
                        e.target.textContent = '☆';
                    } else {
                        localStorage.setItem(key, 'true');
                        e.target.textContent = '⭐';
                    }
                });
            });
        }

        // ── 排序＋篩選 ──
        function normalizeSearchValue(value) {
            return String(value || '')
                .normalize('NFKD')
                .toLowerCase()
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        function companyMatchesSearch(company, query) {
            if (!query) return true;

            const normalizedQuery = normalizeSearchValue(query);
            if (!normalizedQuery) return true;

            return normalizeSearchValue(company.ticker).includes(normalizedQuery)
                || normalizeSearchValue(company.name).includes(normalizedQuery);
        }

        function updateSearchUi(resultCount) {
            const clearBtn = document.getElementById('clear-search-btn');
            const status = document.getElementById('search-status');
            clearBtn.classList.toggle('hidden', searchQuery.length === 0);
            clearBtn.classList.toggle('flex', searchQuery.length > 0);

            if (searchQuery) {
                status.textContent = `找到 ${resultCount} 家符合「${searchQuery}」的公司`;
            } else if (starFilterActive) {
                status.textContent = `顯示 ${resultCount} 家收藏公司`;
            } else {
                status.textContent = `顯示全部 ${resultCount} 家公司`;
            }
        }

        function applySort() {
            const val = document.getElementById('sort-select').value;
            let filtered = starFilterActive
                ? appData.filter(c => localStorage.getItem(`star_${c.ticker}`) === 'true')
                : [...appData];

            filtered = filtered.filter(company => companyMatchesSearch(company, searchQuery));

            if (val === 'countdown_asc') {
                filtered.sort((a, b) => {
                    const valA = calcCountdown(a.reportDate);
                    const valB = calcCountdown(b.reportDate);
                    const na = valA !== null && valA >= 0 ? valA : 99999;
                    const nb = valB !== null && valB >= 0 ? valB : 99999;
                    return na - nb;
                });
            } else if (val === 'countdown_desc') {
                filtered.sort((a, b) => {
                    const valA = calcCountdown(a.reportDate);
                    const valB = calcCountdown(b.reportDate);
                    const na = valA !== null ? valA : -99999;
                    const nb = valB !== null ? valB : -99999;
                    return nb - na;
                });
            } else if (val === 'alpha_asc') {
                filtered.sort((a, b) => a.ticker.localeCompare(b.ticker));
            } else if (val === 'alpha_desc') {
                filtered.sort((a, b) => b.ticker.localeCompare(a.ticker));
            }
            updateSearchUi(filtered.length);
            renderTable(filtered);
        }

        // 收藏篩選按鈕
        document.getElementById('star-filter-btn').addEventListener('click', () => {
            starFilterActive = !starFilterActive;
            updateStarFilterBtn();
            applySort();
        });

        // ── 初始化：平行載入 data.json + historical_data.json ──
        function init() {
            let dataLoaded = false;
            let histLoaded = false;

            function tryRender() {
                if (dataLoaded && histLoaded) {
                    applySort();
                }
            }

            // 載入 data.json（含重試）
            function fetchData(retries = 3) {
                fetch('data.json')
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.json();
                    })
                    .then(data => {
                        appData = data;
                        dataLoaded = true;
                        tryRender();
                    })
                    .catch(err => {
                        if (retries > 0) {
                            setTimeout(() => fetchData(retries - 1), 2000);
                        } else {
                            document.getElementById('data-container').innerHTML =
                                `<tr><td colspan="6" class="p-8 text-center text-red-500 font-medium">無法載入資料，請重新整理頁面</td></tr>`;
                        }
                    });
            }

            // 載入 historical_data.json
            function fetchHistorical() {
                fetch('historical_data.json')
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.json();
                    })
                    .then(data => {
                        historicalData = data;
                        histLoaded = true;
                        tryRender();
                    })
                    .catch(() => {
                        // historical_data.json 載入失敗不是致命錯誤
                        console.warn('historical_data.json 載入失敗，歷史財報面板將無法顯示');
                        histLoaded = true;
                        tryRender();
                    });
            }

            fetchData();
            fetchHistorical();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sort-select').addEventListener('change', applySort);

            const searchInput = document.getElementById('company-search');
            searchInput.addEventListener('input', (event) => {
                searchQuery = event.target.value.trim();
                applySort();
            });
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && searchInput.value) {
                    searchInput.value = '';
                    searchQuery = '';
                    applySort();
                }
            });
            document.getElementById('clear-search-btn').addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                applySort();
                searchInput.focus();
            });

            init();
        });
    </script>
</body>
</html>
