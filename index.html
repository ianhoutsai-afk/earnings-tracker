<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Earnings Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937', // 增加一個柔和的深色調
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 優化滾動條外觀 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 md:p-8 font-sans transition-colors duration-300">
    <div class="max-w-[1400px] mx-auto">
        
        <!-- 標題與模式切換區 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">📈 S&P 500 Earnings Tracker</h1>
            <button id="theme-toggle" class="px-4 py-2 text-sm font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                切換日/夜模式
            </button>
        </div>
        
        <!-- 數據表格容器 (一行一家公司結構) -->
        <div class="w-full overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-850 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                        <th class="p-4 font-semibold w-16 text-center">關注</th>
                        <th class="p-4 font-semibold">公司名稱 (代碼)</th>
                        <th class="p-4 font-semibold">預計發布日</th>
                        <th class="p-4 font-semibold">預期 EPS</th>
                        <th class="p-4 font-semibold">預估營收</th>
                        <th class="p-4 font-semibold border-l border-gray-200 dark:border-gray-700 text-center">歷史 Q1</th>
                        <th class="p-4 font-semibold text-center">歷史 Q2</th>
                        <th class="p-4 font-semibold text-center">歷史 Q3</th>
                        <th class="p-4 font-semibold text-center">歷史 Q4</th>
                    </tr>
                </thead>
                <tbody id="data-container" class="text-sm">
                    <!-- 載入中狀態 -->
                    <tr>
                        <td colspan="9" class="p-8 text-center text-gray-400 dark:text-gray-500">
                            正在載入數據...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 深淺色模式切換邏輯
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // 取得 JSON 數據並渲染
        document.addEventListener('DOMContentLoaded', () => {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('data-container');
                    container.innerHTML = '';
                    
                    data.forEach(company => {
                        // 處理本地收藏 (星星)
                        const isStarred = localStorage.getItem(`star_${company.ticker}`) === 'true';
                        const starIcon = isStarred ? '⭐' : '☆';
                        
                        // 處理 4 個季度的歷史 EPS，若無資料則顯示 '-'
                        const h1 = company.history && company.history[0] ? company.history[0].eps_reported : '-';
                        const h2 = company.history && company.history[1] ? company.history[1].eps_reported : '-';
                        const h3 = company.history && company.history[2] ? company.history[2].eps_reported : '-';
                        const h4 = company.history && company.history[3] ? company.history[3].eps_reported : '-';

                        const tr = document.createElement('tr');
                        // 使用高質感、無突兀綠色的 Hover 效果
                        tr.className = 'border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors duration-150 group';
                        
                        tr.innerHTML = `
                            <td class="p-4 text-center cursor-pointer text-lg star-btn select-none" data-ticker="${company.ticker}">${starIcon}</td>
                            <td class="p-4">
                                <span class="font-bold text-gray-900 dark:text-gray-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${company.name || company.ticker}</span> 
                                <span class="text-gray-500 dark:text-gray-400 ml-1">(${company.ticker})</span>
                            </td>
                            <td class="p-4 text-gray-800 dark:text-gray-300 font-medium">
                                ${company.reportDate || '-'} ${company.bmo_amc ? `<span class="ml-1 text-xs opacity-80">${company.bmo_amc}</span>` : ''}
                            </td>
                            <td class="p-4 text-gray-700 dark:text-gray-300">${company.eps || '-'}</td>
                            <td class="p-4 text-gray-700 dark:text-gray-300">${company.revenue || '-'}</td>
                            
                            <!-- 歷史數據顯示區 -->
                            <td class="p-4 text-center text-gray-500 dark:text-gray-400 border-l border-gray-100 dark:border-gray-700/50">${h1}</td>
                            <td class="p-4 text-center text-gray-500 dark:text-gray-400">${h2}</td>
                            <td class="p-4 text-center text-gray-500 dark:text-gray-400">${h3}</td>
                            <td class="p-4 text-center text-gray-500 dark:text-gray-400">${h4}</td>
                        `;
                        container.appendChild(tr);
                    });

                    // 星星點擊事件，儲存至 LocalStorage
                    document.querySelectorAll('.star-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const ticker = e.target.getAttribute('data-ticker');
                            const key = `star_${ticker}`;
                            const isStarred = localStorage.getItem(key) === 'true';
                            if (isStarred) {
                                localStorage.removeItem(key);
                                e.target.textContent = '☆';
                            } else {
                                localStorage.setItem(key, 'true');
                                e.target.textContent = '⭐';
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('data-container').innerHTML = `
                        <tr>
                            <td colspan="9" class="p-8 text-center text-red-500 font-medium border-t border-gray-200 dark:border-gray-700">
                                無法載入財報資料，請確認 data.json 檔案是否存在或稍後再試。
                            </td>
                        </tr>
                    `;
                });
        });
    </script>
</body>
</html>
